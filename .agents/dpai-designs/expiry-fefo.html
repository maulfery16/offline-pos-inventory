  .exp__btn--ghost { background: var(--color-surface, #fff); border-color: var(--color-border-strong, #cbd2dc); color: inherit; }

  .exp__rules { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2, 8px); }

<script>
(() => {
  const TODAY = new Date('2026-04-18T00:00:00');
  const batches = [
    { id: 'b1', sku: '8991234567890', name: 'Susu Ultra 250ml', batch: 'B1174', expiry: '2026-04-23', branch: 'Kebayoran', qty: 12, cost: 5900, blocked: false, action: null },
    { id: 'b2', sku: '8998765432109', name: 'Roti Tawar Sari Roti', batch: 'B1180', expiry: '2026-04-21', branch: 'Kebayoran', qty: 6, cost: 14000, blocked: false, action: null },
    { id: 'b3', sku: '8996000223344', name: 'Yogurt Cimory 200ml', batch: 'B1160', expiry: '2026-04-16', branch: 'Kebayoran', qty: 4, cost: 7400, blocked: true, action: 'blocked' },
    { id: 'b4', sku: '8991234567890', name: 'Susu Ultra 250ml', batch: 'B1179', expiry: '2026-04-29', branch: 'Bintaro', qty: 24, cost: 5900, blocked: false, action: null },
    { id: 'b5', sku: '8991002101147', name: 'Indomie Goreng 85g', batch: 'B2321', expiry: '2026-05-12', branch: 'Kebayoran', qty: 48, cost: 2900, blocked: false, action: null },
    { id: 'b6', sku: '8997000334455', name: 'Yakult Original 65ml', batch: 'B1181', expiry: '2026-05-01', branch: 'Bintaro', qty: 30, cost: 2100, blocked: false, action: null },
    { id: 'b7', sku: '8996000223344', name: 'Keju Cheddar 170g', batch: 'B1170', expiry: '2026-05-18', branch: 'Kebayoran', qty: 9, cost: 23500, blocked: false, action: 'return' },
    { id: 'b8', sku: '8995000112233', name: 'Kopi Kapal Api 165g', batch: 'B2280', expiry: '2026-11-14', branch: 'Kebayoran', qty: 21, cost: 9800, blocked: false, action: null },
    { id: 'b9', sku: '8991112223334', name: 'Teh Pucuk 350ml', batch: 'B2305', expiry: '2026-07-23', branch: 'Bintaro', qty: 36, cost: 3400, blocked: false, action: null },
    { id: 'b10', sku: '8997000334455', name: 'Minyak Goreng 2L', batch: 'B2290', expiry: '2026-12-02', branch: 'Kebayoran', qty: 18, cost: 32000, blocked: false, action: null }
  ];

  const rupiah = (value) => 'Rp' + Math.round(value).toLocaleString('id-ID');
  const daysLeft = (iso) => Math.round((new Date(iso + 'T00:00:00') - TODAY) / 86400000);
  const bucketsEl = root.querySelector('[data-part="buckets"]');
  const chartEl = root.querySelector('[data-part="chart"]');
  const tableBody = root.querySelector('[data-part="table-body"]');
  const tableEmpty = root.querySelector('[data-part="table-empty"]');
  const ranges = [...root.querySelectorAll('[data-part="ranges"] button')];
  const sortSelect = root.querySelector('[data-part="sort"]');
  const log = root.querySelector('[data-part="log"]');
  let range = 30;
  let sort = 'fefo';

  const bucketDefs = [
    { key: 'expired', label: 'Sudah kedaluwarsa', tone: 'danger', test: (d) => d <= 0 },
    { key: '7', label: '≤7 hari', tone: 'danger', test: (d) => d > 0 && d <= 7 },
    { key: '14', label: '8–14 hari', tone: 'warn', test: (d) => d > 7 && d <= 14 },
    { key: '30', label: '15–30 hari', tone: 'warn', test: (d) => d > 14 && d <= 30 },
    { key: 'later', label: '>30 hari', tone: 'calm', test: (d) => d > 30 }
  ];

  const inRange = (batch) => {
    if (range === 'all') return true;
    const days = daysLeft(batch.expiry);
    return days <= Number(range);
  };

  const statusOf = (batch) => {
    const days = daysLeft(batch.expiry);
    if (batch.blocked) return { chip: 'exp__chip--blocked', text: 'Diblokir' };
    if (days <= 0) return { chip: 'exp__chip--danger', text: 'Kritis' };
    if (days <= 7) return { chip: 'exp__chip--danger', text: 'Prioritas' };
    if (days <= 30) return { chip: 'exp__chip--warn', text: 'Perhatian' };
    return { chip: 'exp__chip--ok', text: 'Normal' };
  };

  const renderBuckets = () => {
    bucketsEl.innerHTML = '';
    let riskyValue = 0;
    bucketDefs.forEach((bucket) => {
      const rows = batches.filter((batch) => bucket.test(daysLeft(batch.expiry)));
      rows.forEach((batch) => {
        if (daysLeft(batch.expiry) <= 30) riskyValue += batch.qty * batch.cost;
      });
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'exp__bucket';
      button.dataset.part = 'bucket';
      button.dataset.bucket = bucket.key;
      button.setAttribute('aria-pressed', 'false');
      button.innerHTML =
        '<span class="exp__bucket-label"><span></span><span class="exp__chip ' +
        (bucket.tone === 'danger' ? 'exp__chip--danger' : bucket.tone === 'warn' ? 'exp__chip--warn' : 'exp__chip--ok') +
        '">' + rows.length + ' batch</span></span>' +
        '<span class="exp__bucket-value"></span>' +
        '<span class="exp__bucket-foot"></span>';
      button.querySelector('.exp__bucket-label span').textContent = bucket.label;
      button.querySelector('.exp__bucket-value').textContent = rupiah(rows.reduce((sum, batch) => sum + batch.qty * batch.cost, 0));
      const foot = button.querySelector('.exp__bucket-foot');
      foot.textContent = rows.reduce((sum, batch) => sum + batch.qty, 0) + ' unit pada ' + rows.length + ' batch';
      if (bucket.tone === 'danger') foot.dataset.tone = 'danger';
      if (bucket.key === 'expired' || bucket.key === '7') clickTarget(button);
      bucketsEl.append(button);
    });
    root.querySelector('[data-part="chart-total"]').textContent = batches.length + ' batch terdaftar';
    renderChart(riskyValue);
  };

  const clickTarget = (button) => {
    button.addEventListener('click', () => {
      const bucket = button.dataset.bucket;
      const next = bucket === 'expired' || bucket === '7' ? '7' : bucket === '14' ? '14' : '30';
      setRange(next);
    }, { signal });
  };

  const renderChart = () => {
    chartEl.innerHTML = '';
    const defs = [
      { label: 'Kedaluwarsa', tone: 'danger', count: batches.filter((b) => daysLeft(b.expiry) <= 0).length },
      { label: '≤7 hari', tone: 'danger', count: batches.filter((b) => { const d = daysLeft(b.expiry); return d > 0 && d <= 7; }).length },
      { label: '8–14 hari', tone: 'warn', count: batches.filter((b) => { const d = daysLeft(b.expiry); return d > 7 && d <= 14; }).length },
      { label: '15–30 hari', tone: 'warn', count: batches.filter((b) => { const d = daysLeft(b.expiry); return d > 14 && d <= 30; }).length },
      { label: '>30 hari', tone: 'calm', count: batches.filter((b) => daysLeft(b.expiry) > 30).length }
    ];
    const max = Math.max(1, ...defs.map((def) => def.count));
    chartEl.style.gridTemplateColumns = 'repeat(' + defs.length + ', minmax(0, 1fr))';
    defs.forEach((def) => {
      const col = document.createElement('div');
      col.className = 'exp__bar-col';
      const value = document.createElement('span');
      value.className = 'exp__bar-value';
      value.textContent = String(def.count);
      const bar = document.createElement('span');
      bar.className = 'exp__bar';
      bar.dataset.tone = def.tone;
      bar.style.height = Math.max(6, Math.round(def.count / max * 130)) + 'px';
      bar.setAttribute('aria-hidden', 'true');
      const label = document.createElement('span');
      label.className = 'exp__bar-label';
      label.textContent = def.label;
      col.append(value, bar, label);
      chartEl.append(col);
    });
  };

  const renderTable = () => {
    const rows = batches.filter(inRange).sort((a, b) => {
      if (sort === 'latest') return daysLeft(b.expiry) - daysLeft(a.expiry);
      if (sort === 'value') return (b.qty * b.cost) - (a.qty * a.cost);
      return daysLeft(a.expiry) - daysLeft(b.expiry);
    });

    tableBody.innerHTML = '';
    tableEmpty.hidden = rows.length > 0;
    root.querySelector('[data-part="table-count"]').textContent = rows.length + ' batch';

    rows.forEach((batch) => {
      const days = daysLeft(batch.expiry);
      const status = statusOf(batch);
      const tr = document.createElement('tr');
      tr.dataset.part = 'batch';
      tr.dataset.id = batch.id;
      tr.innerHTML =
        '<td><span class="exp__item-name"></span><span class="exp__item-sku"></span></td>' +
        '<td></td>' +
        '<td></td>' +
        '<td class="num" data-part="days"></td>' +
        '<td></td>' +
        '<td class="num"></td>' +
        '<td class="num"></td>' +
        '<td><span class="exp__chip ' + status.chip + '">' + status.text + '</span></td>' +
        '<td><span class="exp__actions">' +
          '<button class="exp__btn exp__btn--ghost" type="button" data-action="exp:return">Retur</button>' +
          '<button class="exp__btn ' + (batch.blocked ? 'exp__btn--ghost' : 'exp__btn--danger') + '" type="button" data-action="exp:block">' + (batch.blocked ? 'Buka blokir' : 'Blokir') + '</button>' +
        '</span></td>';
      tr.querySelector('.exp__item-name').textContent = batch.name;
      tr.querySelector('.exp__item-sku').textContent = batch.sku;
      tr.children[1].textContent = batch.batch;
      tr.children[2].textContent = new Date(batch.expiry + 'T00:00:00').toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
      const daysCell = tr.querySelector('[data-part="days"]');
      daysCell.textContent = days <= 0 ? 'Lewat ' + Math.abs(days) + ' hari' : days + ' hari';
      if (days <= 7) { daysCell.style.color = 'var(--color-danger, #a52b22)'; daysCell.style.fontWeight = '600'; }
      tr.children[4].textContent = batch.branch;
      tr.children[5].textContent = String(batch.qty);
      tr.children[6].textContent = rupiah(batch.qty * batch.cost);
      tableBody.append(tr);
    });
  };

  const renderSidebar = () => {
    const blocked = batches.filter((batch) => batch.blocked);
    root.querySelector('[data-part="blocked-count"]').textContent = blocked.length + ' SKU';
    const list = root.querySelector('[data-part="blocked-list"]');
    list.innerHTML = '';
    if (!blocked.length) {
      const li = document.createElement('li');
      li.style.gridTemplateColumns = 'minmax(0, 1fr)';
      li.textContent = 'Tidak ada SKU yang diblokir saat ini.';
      list.append(li);
      return;
    }
    blocked.forEach((batch) => {
      const li = document.createElement('li');
      li.innerHTML = '<span><strong></strong><span></span></span><button class="exp__btn exp__btn--ghost" type="button" data-action="exp:unblock" data-id="' + batch.id + '">Buka</button>';
      li.querySelector('strong').textContent = batch.name;
      li.querySelector('span span').textContent = batch.batch + ' · ' + batch.qty + ' unit di kasir ditolak';
      list.append(li);
    });
  };

  const pushLog = (text) => {
    const li = document.createElement('li');
    const icon = document.createElement('iconify-icon');
    icon.setAttribute('icon', 'lucide:history');
    icon.setAttribute('aria-hidden', 'true');
    li.append(icon, document.createTextNode(text));
    log.prepend(li);
    while (log.children.length > 4) log.lastElementChild.remove();
  };

  const renderLog = () => {
    log.innerHTML = '';
    [
      'Peringatan 7 hari dikirim ke Stok: 2 batch Yogurt dan Roti Tawar.',
      'Batch B2321 (Indomie Goreng) masuk dengan kedaluwarsa 12 Mei.',
      'Cimory 200ml diblokir otomatis setelah melewati tanggal kedaluwarsa.'
    ].forEach((text) => {
      const li = document.createElement('li');
      const icon = document.createElement('iconify-icon');
      icon.setAttribute('icon', 'lucide:history');
      icon.setAttribute('aria-hidden', 'true');
      li.append(icon, document.createTextNode(text));
      log.append(li);
    });
  };

  const setRange = (next) => {
    range = next;
    ranges.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.range === String(next))));
    bucketsEl.querySelectorAll('[data-part="bucket"]').forEach((button) => {
      const bucket = button.dataset.bucket;
      const active = (String(next) === '7' && (bucket === 'expired' || bucket === '7')) ||
        (String(next) === '14' && bucket === '14') ||
        (String(next) === '30' && bucket === '30') ||
        (String(next) === 'all' && bucket === 'later');
      button.setAttribute('aria-pressed', String(active));
    });
    renderTable();
  };

  root.addEventListener('click', (event) => {
    const rangeButton = event.target.closest('[data-part="ranges"] button');
    if (rangeButton && root.contains(rangeButton)) {
      setRange(rangeButton.dataset.range);
      return;
    }
    const control = event.target.closest('[data-action]');
    if (!control || !root.contains(control)) return;
    const row = control.closest('[data-part="batch"]');
    const batch = row ? batches.find((entry) => entry.id === row.dataset.id) : null;

    if (control.dataset.action === 'exp:return' && batch) {
      batch.action = 'return';
      pushLog('Retur supplier diajukan untuk ' + batch.name + ' batch ' + batch.batch + '.');
      control.textContent = 'Retur diajukan';
      control.disabled = true;
      return;
    }
    if (control.dataset.action === 'exp:block' && batch) {
      batch.blocked = true;
      row.querySelector('td:nth-child(8)').innerHTML = '<span class="exp__chip exp__chip--blocked">Diblokir</span>';
      control.textContent = 'Buka blokir';
      control.className = 'exp__btn exp__btn--ghost';
      pushLog(batch.name + ' batch ' + batch.batch + ' diblokir. Pemindaian di kasir ditolak.');
      renderSidebar();
      return;
    }
    if (control.dataset.action === 'exp:unblock') {
      const target = batches.find((entry) => entry.id === control.dataset.id);
      if (target) {
        target.blocked = false;
        pushLog(target.name + ' batch ' + target.batch + ' dibuka kembali untuk kasir.');
        renderSidebar();
        renderTable();
      }
    }
  }, { signal });

  root.addEventListener('change', (event) => {
    if (event.target === sortSelect) {
      sort = sortSelect.value;
      renderTable();
    }
  }, { signal });

  renderBuckets();
  renderSidebar();
  renderLog();
  setRange(30);
})();
</script>
