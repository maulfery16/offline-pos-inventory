<script>
(() => {
  const items = [
    { sku: '8991002101147', name: 'Indomie Goreng 85g', category: 'Makanan instan', available: 48, physical: 48, reorder: 24, expiring: 62 },
    { sku: '8992761123456', name: 'Aqua 600ml', category: 'Minuman', available: 9, physical: 7, reorder: 24, expiring: 118 },
    { sku: '8991234567890', name: 'Susu Ultra 250ml', category: 'Susu & olahan', available: 12, physical: 12, reorder: 18, expiring: 5 },
    { sku: '8998765432109', name: 'Roti Tawar Sari Roti', category: 'Bakery', available: 6, physical: 4, reorder: 10, expiring: 3 },
    { sku: '8991112223334', name: 'Teh Pucuk 350ml', category: 'Minuman', available: 36, physical: 36, reorder: 20, expiring: 96 },
    { sku: '8995000112233', name: 'Kopi Kapal Api 165g', category: 'Minuman', available: 21, physical: 21, reorder: 12, expiring: 210 },
    { sku: '8996000223344', name: 'Yogurt Cimory 200ml', category: 'Susu & olahan', available: 4, physical: 4, reorder: 8, expiring: -2 },
    { sku: '8997000334455', name: 'Sabun Lifebuoy 85g', category: 'Perawatan diri', available: 54, physical: 54, reorder: 20, expiring: 400 },
    { sku: '8998000445566', name: 'Beras Pandan Wangi 5kg', category: 'Sembako', available: 14, physical: 14, reorder: 8, expiring: 320 }
  ];

  const rupiah = (value) => 'Rp' + Math.round(value).toLocaleString('id-ID');
  const list = root.querySelector('[data-part="rows"]');
  const empty = root.querySelector('[data-part="empty"]');
  const search = root.querySelector('[data-part="search"]');
  const tabs = [...root.querySelectorAll('[data-part="tabs"] button')];
  const adjustDialog = root.querySelector('[data-part="adjust-dialog"]');
  const opnameDialog = root.querySelector('[data-part="opname-dialog"]');
  const adjustQty = root.querySelector('[data-part="adjust-qty"]');
  const adjustError = root.querySelector('[data-part="adjust-error"]');
  let filter = 'all';
  let query = '';
  let activeSku = null;
  let counted = new Set(['8991002101147', '8992761123456', '8991234567890', '8998765432109', '8991112223334', '8995000112233']);

  const isLow = (item) => item.available <= item.reorder;
  const isExpiring = (item) => item.expiring <= 30;
  const variance = (item) => item.physical - item.available;

  const matches = (item) => {
    if (query && !(item.name.toLowerCase().includes(query) || item.sku.includes(query))) return false;
    if (filter === 'low') return isLow(item);
    if (filter === 'expiry') return isExpiring(item);
    if (filter === 'variance') return variance(item) !== 0;
    return true;
  };

  const statusOf = (item) => {
    if (item.expiring <= 0) return { chip: 'inv__chip--danger', text: 'Batch kedaluwarsa · diblokir' };
    if (isLow(item)) return { chip: 'inv__chip--warn', text: 'Menipis · di bawah reorder' };
    if (!counted.has(item.sku)) return { chip: 'inv__chip--info', text: 'Perlu opname' };
    return { chip: 'inv__chip--ok', text: 'Aman' };
  };

  const renderCounts = () => {
    const counts = {
      all: items.length,
      low: items.filter(isLow).length,
      expiry: items.filter(isExpiring).length,
      variance: items.filter((item) => variance(item) !== 0).length
    };
    tabs.forEach((tab) => {
      tab.querySelector('[data-part="count"]').textContent = String(counts[tab.dataset.filter]);
    });
    root.querySelector('[data-part="result-count"]').textContent =
      items.filter(matches).length + ' SKU ditampilkan';
    root.querySelector('[data-part="kpi-low"]').textContent = String(counts.low);
    root.querySelector('[data-part="kpi-expiry"]').textContent =
      items.filter(isExpiring).length + ' batch';
  };

  const renderRows = () => {
    list.innerHTML = '';
    const visible = items.filter(matches);
    empty.hidden = visible.length > 0;
    visible.forEach((item) => {
      const status = statusOf(item);
      const diff = variance(item);
      const li = document.createElement('li');
      li.className = 'inv__row';
      li.dataset.part = 'row';
      li.dataset.sku = item.sku;
      li.dataset.low = String(isLow(item));
      li.dataset.expiry = String(isExpiring(item));
      li.dataset.variance = String(diff !== 0);
      li.innerHTML =
        '<span class="inv__item"><span class="inv__item-name"></span><span class="inv__item-meta"></span></span>' +
        '<span class="inv__num"><span class="inv__num-label">Tersedia</span><span data-part="available"></span></span>' +
        '<span class="inv__num"><span class="inv__num-label">Fisik</span><span data-part="physical"></span></span>' +
        '<span class="inv__num inv__num--strong"><span class="inv__num-label">Selisih</span><span class="inv__diff" data-part="diff"></span></span>' +
        '<span><span class="inv__chip ' + status.chip + '">' + status.text + '</span></span>' +
        '<span class="inv__cell--action"><button class="inv__btn inv__btn--ghost inv__btn--sm" type="button" data-action="inv:adjust" data-sku="' + item.sku + '">Sesuaikan</button></span>';
      li.querySelector('.inv__item-name').textContent = item.name;
      li.querySelector('.inv__item-meta').textContent = item.sku + ' · ' + item.category + ' · reorder ' + item.reorder;
      li.querySelector('[data-part="available"]').textContent = String(item.available);
      const physicalInput = li.querySelector('[data-part="physical"]');
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.step = '1';
      input.value = String(item.physical);
      input.dataset.field = 'physical';
      input.setAttribute('aria-label', 'Stok fisik ' + item.name);
      input.style.width = '100%';
      input.style.maxWidth = '96px';
      input.style.minHeight = '38px';
      input.style.padding = '6px 8px';
      input.style.border = '1px solid var(--color-border-strong, #cbd2dc)';
      input.style.borderRadius = 'var(--radius-sm, 6px)';
      input.style.background = 'var(--color-surface, #fff)';
      input.style.color = 'inherit';
      input.style.font = 'inherit';
      input.style.fontSize = 'var(--text-sm, 13px)';
      input.style.fontVariantNumeric = 'tabular-nums';
      physicalInput.replaceWith(input);
      const diffNode = li.querySelector('[data-part="diff"]');
      const dir = diff === 0 ? 'none' : diff > 0 ? 'up' : 'down';
      diffNode.dataset.dir = dir;
      diffNode.textContent = diff > 0 ? '+' + diff : String(diff);
      list.append(li);
    });
    renderCounts();
  };

  const renderAlerts = () => {
    const alerts = root.querySelector('[data-part="alerts"]');
    alerts.innerHTML = '';
    const low = items.filter(isLow);
    root.querySelector('[data-part="alert-count"]').textContent = low.length + ' SKU';
    if (!low.length) {
      const li = document.createElement('li');
      li.textContent = 'Semua SKU berada di atas titik pemesanan ulang.';
      li.style.gridTemplateColumns = 'minmax(0, 1fr)';
      alerts.append(li);
      return;
    }
    low.forEach((item) => {
      const suggested = Math.max(item.reorder * 2 - item.available, item.reorder);
      const li = document.createElement('li');
      li.innerHTML = '<span><strong></strong><span></span></span><span class="inv__suggest"></span>';
      li.querySelector('strong').textContent = item.name;
      li.querySelector('span span').textContent = 'Sisa ' + item.available + ' dari reorder ' + item.reorder;
      li.querySelector('.inv__suggest').textContent = 'Pesan ' + suggested + ' pcs';
      alerts.append(li);
    });
  };

  const renderOpname = () => {
    root.querySelector('[data-part="opname-done"]').textContent = counted.size + ' dari ' + items.length;
    root.querySelector('[data-part="opname-diff"]').textContent =
      items.filter((item) => variance(item) !== 0).length + ' SKU';
    const totalDiff = items.reduce((sum, item) => sum + variance(item), 0);
    root.querySelector('[data-part="kpi-variance"]').textContent = (totalDiff > 0 ? '+' : '') + totalDiff + ' unit';
  };

  const setFilter = (next, focusTab) => {
    filter = next;
    tabs.forEach((tab) => {
      const selected = tab.dataset.filter === next;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
      if (selected) {
        root.querySelector('#inv-panel').setAttribute('aria-labelledby', tab.id);
        if (focusTab) tab.focus();
      }
    });
    renderRows();
  };

  root.addEventListener('click', (event) => {
    const tabButton = event.target.closest('[data-part="tabs"] button');
    if (tabButton && root.contains(tabButton)) {
      setFilter(tabButton.dataset.filter, false);
      return;
    }
    const control = event.target.closest('[data-action]');
    if (!control || !root.contains(control)) return;
    switch (control.dataset.action) {
      case 'inv:adjust': {
        activeSku = control.dataset.sku;
        const item = items.find((entry) => entry.sku === activeSku);
        root.querySelector('[data-part="adjust-target"]').textContent =
          item.name + ' · tersedia ' + item.available + ' unit. Masukkan jumlah fisik hasil hitung.';
        adjustQty.value = String(item.physical);
        adjustError.hidden = true;
        adjustQty.setAttribute('aria-invalid', 'false');
        root.querySelector('[data-part="adjust-diff"]').textContent = String(variance(item));
        adjustDialog.showModal();
        adjustQty.focus();
        break;
      }
      case 'inv:adjust-cancel':
        adjustDialog.close();
        break;
      case 'inv:adjust-save': {
        const value = Number(adjustQty.value);
        if (!Number.isFinite(value) || value < 0) {
          adjustError.hidden = false;
          adjustQty.setAttribute('aria-invalid', 'true');
          adjustQty.focus();
          return;
        }
        const item = items.find((entry) => entry.sku === activeSku);
        item.physical = value;
        counted.add(item.sku);
        adjustDialog.close();
        renderRows();
        renderOpname();
        break;
      }
      case 'inv:finish-opname': {
        const summary = root.querySelector('[data-part="opname-summary"]');
        summary.innerHTML = '';
        const diffs = items.filter((item) => variance(item) !== 0);
        const rows = diffs.length
          ? diffs.map((item) => [item.name, (variance(item) > 0 ? '+' : '') + variance(item) + ' unit dari ' + item.available])
          : [['Tidak ada selisih', 'Semua SKU cocok dengan catatan sistem']];
        rows.forEach(([label, detail]) => {
          const li = document.createElement('li');
          li.innerHTML = '<span><strong></strong><span></span></span>';
          li.querySelector('strong').textContent = label;
          li.querySelector('span span').textContent = detail;
          summary.append(li);
        });
        opnameDialog.showModal();
        root.querySelector('[data-action="inv:opname-close"]').focus();
        break;
      }
      case 'inv:reset-opname':
        counted = new Set();
        renderOpname();
        renderRows();
        search.focus();
        break;
      case 'inv:opname-close':
        opnameDialog.close();
        break;
    }
  }, { signal });

  root.addEventListener('keydown', (event) => {
    const tabButton = event.target.closest('[data-part="tabs"] button');
    if (tabButton) {
      const index = tabs.indexOf(tabButton);
      let nextIndex = null;
      if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
      if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
      if (event.key === 'Home') nextIndex = 0;
      if (event.key === 'End') nextIndex = tabs.length - 1;
      if (nextIndex !== null) {
        event.preventDefault();
        setFilter(tabs[nextIndex].dataset.filter, true);
      }
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        setFilter(tabButton.dataset.filter, true);
      }
    }
    if (event.target === adjustQty && event.key === 'Enter') {
      event.preventDefault();
      root.querySelector('[data-action="inv:adjust-save"]').click();
    }
  }, { signal });

  root.addEventListener('input', (event) => {
    if (event.target === search) {
      query = search.value.trim().toLowerCase();
      renderRows();
      return;
    }
    const row = event.target.closest('[data-part="row"]');
    if (row && event.target.dataset.field === 'physical') {
      const item = items.find((entry) => entry.sku === row.dataset.sku);
      const value = Number(event.target.value);
      if (Number.isFinite(value) && value >= 0) {
        item.physical = value;
        counted.add(item.sku);
        const diff = variance(item);
        const diffNode = row.querySelector('[data-part="diff"]');
        diffNode.dataset.dir = diff === 0 ? 'none' : diff > 0 ? 'up' : 'down';
        diffNode.textContent = diff > 0 ? '+' + diff : String(diff);
        renderOpname();
      }
    }
  }, { signal });

  root.addEventListener('change', (event) => {
    if (event.target === adjustQty) {
      const value = Number(adjustQty.value);
      const item = items.find((entry) => entry.sku === activeSku);
      adjustError.hidden = Number.isFinite(value) && value >= 0;
      adjustQty.setAttribute('aria-invalid', String(!Number.isFinite(value) || value < 0));
      if (item && Number.isFinite(value)) root.querySelector('[data-part="adjust-diff"]').textContent = String(value - item.available);
    }
  }, { signal });

  renderRows();
  renderAlerts();
  renderOpname();
})();
</script>
