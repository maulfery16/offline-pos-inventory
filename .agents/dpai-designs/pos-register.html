          <div class="pos__quick" data-part="cash-quick">
            <button type="button" data-action="pos:cash-quick" data-amount="50000">Rp50.000</button>
            <button type="button" data-action="pos:cash-quick" data-amount="100000">Rp100.000</button>
            <button type="button" data-action="pos:cash-quick" data-amount="exact">Uang pas</button>
          </div>
          <div class="pos__row"><dt>Kembalian</dt><dd class="pos__amount" data-part="change" style="color: var(--color-text, #182230); font-weight: var(--weight-semibold, 600);">Rp0</dd></div>

          <div class="pos__actions">
            <button class="pos__secondary" type="button" data-action="pos:hold">
              <iconify-icon icon="lucide:pause" aria-hidden="true"></iconify-icon>
              Tahan
            </button>
            <button class="pos__secondary" type="button" data-action="pos:clear">
              <iconify-icon icon="lucide:trash-2" aria-hidden="true"></iconify-icon>
              Kosongkan
            </button>
          </div>
          <button class="pos__primary" type="button" data-action="pos:pay" data-node-id="pos-register.payButton">
            <iconify-icon icon="lucide:check" aria-hidden="true"></iconify-icon>
            Bayar &amp; cetak struk
          </button>
        </div>
      </div>

      <div class="pos__panel" data-node-id="pos-register.held">
        <div class="pos__panel-head">
          <h2 class="pos__panel-title">Transaksi ditahan</h2>
          <span class="pos__chip pos__chip--info" data-part="held-count">0</span>
        </div>
        <div class="pos__panel-body">
          <ul class="pos__held" data-part="held-list">
            <li data-part="held-empty" style="border: 0; padding: var(--space-2, 8px) 0; color: var(--color-text-muted, #5a6675);">Belum ada transaksi ditahan.</li>
          </ul>
        </div>
      </div>
    </section>

    <dialog class="pos__dialog" data-part="void-dialog" aria-labelledby="pos-void-title">
      <form method="dialog">
        <div class="pos__dialog-body">
          <div class="pos__dialog-head">
            <div>
              <h2 id="pos-void-title">Otorisasi admin</h2>
              <p style="margin: 4px 0 0; font-size: var(--text-caption, 12px); color: var(--color-text-muted, #5a6675);">Hapus <strong data-part="void-target">item</strong> dari keranjang? Masukkan PIN admin 4–6 digit.</p>
            </div>
          </div>
          <div class="pos__field">
            <label for="pos-void-pin">PIN admin</label>
            <input id="pos-void-pin" class="pos__pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-part="void-pin">
          </div>
          <p class="pos__error" data-part="void-error" hidden>PIN salah. Coba lagi atau minta admin memasukkan PIN.</p>
        </div>
        <div class="pos__dialog-foot">
          <button class="pos__secondary" type="button" data-action="pos:void-cancel">Batal</button>
          <button class="pos__secondary" type="submit" value="confirm" style="background: var(--color-danger, #a52b22); border-color: var(--color-danger, #a52b22); color: #fff;">Hapus item</button>
        </div>
      </form>
    </dialog>

    <dialog class="pos__dialog" data-part="receipt-dialog" aria-labelledby="pos-receipt-title">
      <div class="pos__dialog-body">
        <div class="pos__dialog-head">
          <div>
            <h2 id="pos-receipt-title">Transaksi selesai</h2>
            <p style="margin: 4px 0 0; font-size: var(--text-caption, 12px); color: var(--color-text-muted, #5a6675);" data-part="receipt-ref">Struk #TRX-0000 · Kasir 01</p>
          </div>
          <span class="pos__chip pos__chip--ok" data-part="receipt-sync">Tersinkron</span>
        </div>
        <ul class="pos__receipt" data-part="receipt-lines"></ul>
        <div class="pos__row pos__row--total"><dt>Total</dt><dd class="pos__amount" data-part="receipt-total">Rp0</dd></div>
        <div class="pos__row"><dt data-part="receipt-method-label">Tunai</dt><dd class="pos__amount" data-part="receipt-paid">Rp0</dd></div>
        <div class="pos__row"><dt>Kembalian</dt><dd class="pos__amount" data-part="receipt-change">Rp0</dd></div>
        <p class="pos__notice">
          <iconify-icon icon="lucide:printer" aria-hidden="true"></iconify-icon>
          Struk tercetak di printer kasir 01. Antrean berikutnya siap dilayani.
        </p>
      </div>
      <div class="pos__dialog-foot">
        <button class="pos__primary" type="button" data-action="pos:receipt-close" style="width: auto;">Transaksi baru</button>
      </div>
    </dialog>
  </main>
</template>

<script>
(() => {
  const products = [
    { sku: '8991002101147', name: 'Indomie Goreng 85g', price: 3500, batch: 'A2311', days: 62, stock: 48 },
    { sku: '8992761123456', name: 'Aqua 600ml', price: 4000, batch: 'A2298', days: 118, stock: 9 },
    { sku: '8991234567890', name: 'Susu Ultra 250ml', price: 7500, batch: 'B1174', days: 5, stock: 12 },
    { sku: '8998765432109', name: 'Roti Tawar Sari Roti', price: 18000, batch: 'B1180', days: 3, stock: 6 },
    { sku: '8991112223334', name: 'Teh Pucuk 350ml', price: 4500, batch: 'A2305', days: 96, stock: 36 },
    { sku: '8995000112233', name: 'Kopi Kapal Api 165g', price: 12500, batch: 'A2280', days: 210, stock: 21 },
    { sku: '8996000223344', name: 'Yogurt Cimory 200ml', price: 9500, batch: 'B1160', days: -2, stock: 4, blocked: true }
  ];

  const rupiah = (value) => 'Rp' + Math.round(value).toLocaleString('id-ID');
  const cart = new Map();
  let held = [];
  let method = 'Tunai';
  let online = true;
  let trxSeq = 2841;
  let pendingVoidSku = null;
  let busy = false;

  const cartLines = root.querySelector('[data-part="cart-lines"]');
  const emptyState = root.querySelector('[data-part="cart-empty"]');
  const suggestList = root.querySelector('[data-part="suggestions"]');
  const scanInput = root.querySelector('[data-part="scan-input"]');
  const cashInput = root.querySelector('[data-part="cash-input"]');
  const cashField = root.querySelector('[data-part="cash-field"]');
  const cashQuick = root.querySelector('[data-part="cash-quick"]');
  const voidDialog = root.querySelector('[data-part="void-dialog"]');
  const voidPin = root.querySelector('[data-part="void-pin"]');
  const voidError = root.querySelector('[data-part="void-error"]');
  const voidTarget = root.querySelector('[data-part="void-target"]');
  const receiptDialog = root.querySelector('[data-part="receipt-dialog"]');
  const methodButtons = root.querySelectorAll('[data-part="method"]');

  const findBySku = (sku) => products.find((item) => item.sku === sku);
  const findByName = (query) => products.filter((item) =>
    item.name.toLowerCase().includes(query.toLowerCase()) || item.sku.includes(query));

  const cartTotal = () => [...cart.values()].reduce((sum, line) => sum + line.price * line.qty, 0);

  const renderSuggestions = (query) => {
    suggestList.innerHTML = '';
    if (!query || query.length < 2) return;
    const matches = findByName(query).slice(0, 5);
    if (!matches.length) {
      const notice = document.createElement('li');
      notice.className = 'pos__notice';
      notice.textContent = 'Barcode belum terdaftar. Tekan Enter untuk menambah barang cepat dengan harga manual.';
      notice.dataset.part = 'quick-add';
      suggestList.append(notice);
      return;
    }
    matches.forEach((item) => {
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.part = 'suggest';
      button.dataset.sku = item.sku;
      button.innerHTML = '<span><span class="pos__suggest-name"></span> <span class="pos__suggest-sku"></span></span><span class="pos__suggest-price"></span>';
      button.querySelector('.pos__suggest-name').textContent = item.name;
      button.querySelector('.pos__suggest-sku').textContent = item.sku;
      button.querySelector('.pos__suggest-price').textContent = rupiah(item.price);
      suggestList.append(li);
      li.append(button);
    });
  };

  const syncTiles = () => {
    root.querySelectorAll('[data-part="product"]').forEach((tile) => {
      const item = findBySku(tile.dataset.sku);
      if (!item) return;
      tile.dataset.blocked = String(Boolean(item.blocked));
      const chip = tile.querySelector('[data-part="stock"]');
      const inCart = cart.get(item.sku);
      const remaining = item.stock - (inCart ? inCart.qty : 0);
      if (item.blocked) {
        chip.className = 'pos__chip pos__chip--danger';
        chip.textContent = 'Batch kedaluwarsa';
      } else if (remaining <= 10) {
        chip.className = 'pos__chip pos__chip--low';
        chip.textContent = 'Stok ' + remaining;
      } else {
        chip.className = 'pos__chip pos__chip--ok';
        chip.textContent = 'Stok ' + remaining;
      }
    });
  };

  const renderCart = () => {
    cartLines.querySelectorAll('[data-part="cart-line"]').forEach((node) => node.remove());
    const lines = [...cart.values()];
    emptyState.hidden = lines.length > 0;
    lines.forEach((line) => {
      const li = document.createElement('li');
      li.className = 'pos__line';
      li.dataset.part = 'cart-line';
      li.dataset.sku = line.sku;
      li.innerHTML =
        '<div><p class="pos__line-name"></p><p class="pos__line-batch"></p></div>' +
        '<p class="pos__line-price"></p>' +
        '<div class="pos__line-actions">' +
          '<span class="pos__step">' +
            '<button type="button" data-action="pos:qty-down" aria-label="Kurangi jumlah">−</button>' +
            '<output data-part="line-qty"></output>' +
            '<button type="button" data-action="pos:qty-up" aria-label="Tambah jumlah">+</button>' +
          '</span>' +
          '<button class="pos__link-btn" type="button" data-action="pos:void">Hapus · butuh PIN admin</button>' +
        '</div>';
      li.querySelector('.pos__line-name').textContent = line.name;
      li.querySelector('.pos__line-batch').textContent =
        'Batch ' + line.batch + ' · ' + (line.days >= 0 ? 'kedaluwarsa ' + line.days + ' hari lagi' : 'batch kedaluwarsa');
      li.querySelector('.pos__line-price').textContent = rupiah(line.price * line.qty);
      li.querySelector('[data-part="line-qty"]').textContent = line.qty;
      cartLines.append(li);
    });

    const total = cartTotal();
    const discount = total >= 150000 ? Math.round(total * 0.05) : 0;
    const net = total - discount;
    root.querySelector('[data-part="subtotal"]').textContent = rupiah(total);
    root.querySelector('[data-part="discount"]').textContent = '−' + rupiah(discount);
    root.querySelector('[data-part="total"]').textContent = rupiah(net);
    root.querySelector('[data-part="cart-count"]').textContent =
      [...cart.values()].reduce((n, line) => n + line.qty, 0) + ' item';
    updateChange();
    syncTiles();
  };

  const updateChange = () => {
    const total = cartTotal() - (cartTotal() >= 150000 ? Math.round(cartTotal() * 0.05) : 0);
    const paid = method === 'Tunai' ? Number(cashInput.value || 0) : total;
    const change = Math.max(0, paid - total);
    root.querySelector('[data-part="change"]').textContent = rupiah(change);
    if (method !== 'Tunai') root.querySelector('[data-part="change"]').textContent = 'Rp0';
  };

  const addToCart = (item) => {
    if (!item || item.blocked) return false;
    const line = cart.get(item.sku);
    if (line) line.qty += 1;
    else cart.set(item.sku, { ...item, qty: 1 });
    renderCart();
    return true;
  };

  const renderHeld = () => {
    const list = root.querySelector('[data-part="held-list"]');
    list.innerHTML = '';
    root.querySelector('[data-part="held-count"]').textContent = String(held.length);
    if (!held.length) {
      const li = document.createElement('li');
      li.style.border = '0';
      li.style.padding = '8px 0';
      li.style.color = 'var(--color-text-muted, #5a6675)';
      li.textContent = 'Belum ada transaksi ditahan.';
      list.append(li);
      return;
    }
    held.forEach((entry) => {
      const li = document.createElement('li');
      li.innerHTML = '<span><strong></strong><span></span></span>';
      li.querySelector('strong').textContent = entry.label;
      li.querySelector('span span').textContent = entry.count + ' item · ' + rupiah(entry.total);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pos__link-btn pos__link-btn--muted';
      button.dataset.action = 'pos:resume';
      button.dataset.heldId = entry.id;
      button.textContent = 'Lanjutkan';
      li.append(button);
      list.append(li);
    });
  };

  const setMethod = (next) => {
    method = next;
    methodButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.method === next)));
    const cashMode = next === 'Tunai';
    cashField.hidden = !cashMode;
    cashQuick.hidden = !cashMode;
    updateChange();
  };

  const openVoidDialog = (sku) => {
    pendingVoidSku = sku;
    const line = cart.get(sku);
    voidTarget.textContent = line ? line.name : 'item';
    voidPin.value = '';
    voidError.hidden = true;
    voidDialog.showModal();
    voidPin.focus();
  };

  const finishSale = () => {
    const total = cartTotal();
    const discount = total >= 150000 ? Math.round(total * 0.05) : 0;
    const net = total - discount;
    const paid = method === 'Tunai' ? Number(cashInput.value || 0) : net;
    trxSeq += 1;
    root.querySelector('[data-part="receipt-ref"]').textContent = 'Struk #TRX-' + trxSeq + ' · Kasir 01';
    root.querySelector('[data-part="receipt-total"]').textContent = rupiah(net);
    root.querySelector('[data-part="receipt-paid"]').textContent = rupiah(paid);
    root.querySelector('[data-part="receipt-change"]').textContent = rupiah(Math.max(0, paid - net));
    root.querySelector('[data-part="receipt-method-label"]').textContent = method;
    const sync = root.querySelector('[data-part="receipt-sync"]');
    sync.textContent = online ? 'Tersinkron' : 'Menunggu sinkronisasi';
    sync.className = 'pos__chip ' + (online ? 'pos__chip--ok' : 'pos__chip--low');

    const lines = root.querySelector('[data-part="receipt-lines"]');
    lines.innerHTML = '';
    cart.forEach((line) => {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><span class="pos__amount"></span>';
      li.firstElementChild.textContent = line.qty + '× ' + line.name + ' (' + line.batch + ')';
      li.lastElementChild.textContent = rupiah(line.price * line.qty);
      lines.append(li);
    });
    if (!cart.size) return false;

    cart.clear();
    cashInput.value = '0';
    renderCart();
    receiptDialog.showModal();
    root.querySelector('[data-action="pos:receipt-close"]').focus();
    return true;
  };

  root.addEventListener('click', (event) => {
    const control = event.target.closest('[data-action], [data-part="product"], [data-part="suggest"], [data-part="method"]');
    if (!control || !root.contains(control)) return;

    if (control.dataset.part === 'product' || control.dataset.part === 'suggest') {
      const item = findBySku(control.dataset.sku);
      if (item && item.blocked) {
        scanInput.value = '';
        renderSuggestions('');
        scanInput.setAttribute('aria-invalid', 'true');
        scanInput.placeholder = 'Diblokir: semua batch ' + item.name + ' sudah kedaluwarsa';
        return;
      }
      addToCart(item);
      scanInput.value = '';
      renderSuggestions('');
      scanInput.setAttribute('aria-invalid', 'false');
      scanInput.placeholder = 'Pindai barcode atau ketik nama barang…';
      return;
    }

    if (control.dataset.part === 'method') { setMethod(control.dataset.method); return; }

    switch (control.dataset.action) {
      case 'pos:qty-up':
      case 'pos:qty-down': {
        const line = control.closest('[data-part="cart-line"]');
        const entry = cart.get(line.dataset.sku);
        if (!entry) return;
        entry.qty = control.dataset.action === 'pos:qty-up' ? entry.qty + 1 : Math.max(1, entry.qty - 1);
        renderCart();
        break;
      }
      case 'pos:void': {
        const line = control.closest('[data-part="cart-line"]');
        openVoidDialog(line.dataset.sku);
        break;
      }
      case 'pos:void-cancel':
        pendingVoidSku = null;
        voidDialog.close();
        break;
      case 'pos:cash-quick': {
        const amount = control.dataset.amount;
        const total = cartTotal();
        const net = total - (total >= 150000 ? Math.round(total * 0.05) : 0);
        cashInput.value = String(amount === 'exact' ? net : Number(amount));
        updateChange();
        break;
      }
      case 'pos:clear':
        cart.clear();
        cashInput.value = '0';
        renderCart();
        break;
      case 'pos:hold': {
        if (!cart.size) return;
        held.push({
          id: 'hold-' + (held.length + 1),
          label: 'Pelanggan ' + (held.length + 1),
          count: [...cart.values()].reduce((n, line) => n + line.qty, 0),
          total: cartTotal(),
          lines: [...cart.values()].map((line) => ({ ...line }))
        });
        cart.clear();
        cashInput.value = '0';
        renderCart();
        renderHeld();
        break;
      }
      case 'pos:resume': {
        const entry = held.find((item) => item.id === control.dataset.heldId);
        if (!entry) return;
        entry.lines.forEach((line) => {
          const existing = cart.get(line.sku);
          if (existing) existing.qty += line.qty;
          else cart.set(line.sku, { ...line });
        });
        held = held.filter((item) => item.id !== entry.id);
        renderCart();
        renderHeld();
        break;
      }
      case 'pos:focus-scan':
        scanInput.focus();
        break;
      case 'pos:toggle-network': {
        online = !online;
        const banner = root.querySelector('[data-part="network"]');
        const container = banner.closest('[data-node-id="pos-register.network"]');
        container.dataset.state = online ? 'online' : 'offline';
        container.querySelector('iconify-icon').setAttribute('icon', online ? 'lucide:wifi' : 'lucide:wifi-off');
        container.querySelector('[data-part="network-text"]').textContent = online
          ? 'Online — stok tersinkron ke cloud. Transaksi tercatat langsung.'
          : 'Offline — 14 transaksi menunggu sinkronisasi. Stok lokal boleh minus agar antrean tetap lancar.';
        control.textContent = online ? 'Simulasikan offline' : 'Coba sambungkan ulang';
        break;
      }
      case 'pos:pay': {
        if (busy || !cart.size) return;
        const total = cartTotal();
        const net = total - (total >= 150000 ? Math.round(total * 0.05) : 0);
        if (method === 'Tunai' && Number(cashInput.value || 0) < net) {
          cashInput.setAttribute('aria-invalid', 'true');
          cashInput.focus();
          root.querySelector('[data-part="change"]').textContent = 'Uang kurang ' + rupiah(net - Number(cashInput.value || 0));
          return;
        }
        cashInput.setAttribute('aria-invalid', 'false');
        const payButton = root.querySelector('[data-action="pos:pay"]');
        busy = true;
        payButton.dataset.state = 'charging';
        payButton.disabled = true;
        const timer = setTimeout(() => {
          busy = false;
          payButton.dataset.state = '';
          payButton.disabled = false;
          finishSale();
        }, 700);
        onCleanup(() => clearTimeout(timer));
        break;
      }
      case 'pos:receipt-close':
        receiptDialog.close();
        scanInput.focus();
        break;
    }
  }, { signal });

  root.querySelector('[data-part="void-dialog"]').addEventListener('close', () => {
    if (voidDialog.returnValue === 'confirm' && pendingVoidSku) {
      const pin = voidPin.value.trim();
      if (pin === '246810') {
        cart.delete(pendingVoidSku);
        pendingVoidSku = null;
        renderCart();
      } else {
        voidError.hidden = false;
        voidPin.value = '';
        voidDialog.showModal();
      }
    }
    voidDialog.returnValue = '';
  }, { signal });

  root.addEventListener('input', (event) => {
    if (event.target === scanInput) renderSuggestions(scanInput.value.trim());
    if (event.target === cashInput) updateChange();
  }, { signal });

  root.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    if (event.target === scanInput) {
      event.preventDefault();
      const query = scanInput.value.trim();
      if (!query) return;
      const exact = findBySku(query) || products.find((item) => item.name.toLowerCase() === query.toLowerCase());
      if (exact) {
        if (exact.blocked) {
          scanInput.setAttribute('aria-invalid', 'true');
          scanInput.placeholder = 'Diblokir: ' + exact.name + ' kedaluwarsa';
          return;
        }
        addToCart(exact);
        scanInput.value = '';
        renderSuggestions('');
      } else {
        const fallback = findByName(query)[0];
        if (fallback && !fallback.blocked) {
          addToCart(fallback);
          scanInput.value = '';
          renderSuggestions('');
        }
      }
    }
    if (event.target === voidPin) event.preventDefault();
  }, { signal });

  setMethod('Tunai');
  renderCart();
  renderHeld();
  scanInput.focus();
})();
</script>
