      trx: Math.max(1, Math.round(base.trx * factor)),
      days: base.days.map((day) => ({ label: day.label, sales: Math.round(day.sales * factor), profit: Math.round(day.profit * factor) })),
      branches: base.branches,
      products: base.products,
      branchSales: entry.sales,
      branchProfit: entry.profit
    };
  };

  const renderKpis = () => {
    const d = data();
    const sales = d.branchSales;
    const cogs = d.products.reduce((sum, item) => sum + item.cogs, 0);
    const profit = sales - cogs;
    const margin = sales ? (profit / sales * 100) : 0;
    const basket = sales / d.trx;

    root.querySelector('[data-part="kpi-sales"]').textContent = rupiah(sales);
    root.querySelector('[data-part="kpi-cogs"]').textContent = rupiah(cogs);
    root.querySelector('[data-part="kpi-profit"]').textContent = rupiah(profit);
    root.querySelector('[data-part="kpi-margin"]').textContent = margin.toFixed(1).replace('.', ',') + '%';
    root.querySelector('[data-part="kpi-basket"]').textContent = rupiah(basket);
    root.querySelector('[data-part="kpi-trx"]').textContent = d.trx + ' transaksi · ' + d.label + ' · ' + branch;

    const salesFoot = root.querySelector('[data-part="kpi-sales-foot"]');
    salesFoot.textContent = 'Rata-rata ' + rupiah(basket) + ' per transaksi';
    const profitFoot = root.querySelector('[data-part="kpi-profit-foot"]');
    profitFoot.dataset.tone = margin >= 20 ? 'up' : 'down';
    profitFoot.textContent = margin >= 22
      ? 'Di atas target 22% · komposisi produk sehat'
      : 'Di bawah target 22% · periksa margin produk cepat laku';

    expectedCash = Math.round(sales * 0.62);
    root.querySelector('[data-part="shift-expected"]').textContent = rupiah(expectedCash);
    root.querySelector('[data-part="shift-qris"]').textContent = rupiah(sales * 0.26);
    root.querySelector('[data-part="shift-card"]').textContent = rupiah(sales * 0.12);
  };

  const renderLineChart = () => {
    const d = data();
    const width = 720;
    const height = 240;
    const padX = 46;
    const padTop = 16;
    const padBottom = 40;
    const plotW = width - padX - 16;
    const plotH = height - padTop - padBottom;
    const max = Math.max(1, ...d.days.map((day) => day.sales));
    const step = d.days.length > 1 ? plotW / (d.days.length - 1) : 0;
    const x = (index) => padX + index * step;
    const y = (value) => padTop + plotH - (value / max) * plotH;

    const pointsFor = (key) => d.days.map((day, index) => x(index) + ',' + y(day[key]).toFixed(1)).join(' ');
    const labels = [0, 0.5, 1].map((ratio) => {
      const value = max * ratio;
      const yy = y(value);
      const short = value >= 1000000 ? (value / 1000000).toFixed(1).replace('.', ',') + ' jt' : Math.round(value / 1000) + ' rb';
      return '<line x1="' + padX + '" y1="' + yy.toFixed(1) + '" x2="' + (padX + plotW) + '" y2="' + yy.toFixed(1) + '" stroke="var(--color-border, #e2e6ec)" stroke-width="1"></line>' +
        '<text x="' + (padX - 8) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--color-text-muted, #5a6675)">' + short + '</text>';
    }).join('');
    const ticks = d.days.map((day, index) =>
      '<text x="' + x(index).toFixed(1) + '" y="' + (height - 14) + '" text-anchor="middle" font-size="11" fill="var(--color-text-muted, #5a6675)">' + day.label + '</text>').join('');
    const dots = d.days.map((day, index) =>
      '<circle cx="' + x(index).toFixed(1) + '" cy="' + y(day.profit).toFixed(1) + '" r="3.5" fill="var(--color-primary, #0f6d5f)"></circle>').join('');

    chart.innerHTML =
      labels + ticks +
      '<polyline points="' + pointsFor('sales') + '" fill="none" stroke="var(--color-accent, #12507f)" stroke-width="2.5" stroke-linejoin="round"></polyline>' +
      '<polyline points="' + pointsFor('profit') + '" fill="none" stroke="var(--color-primary, #0f6d5f)" stroke-width="2.5" stroke-linejoin="round"></polyline>' +
      dots;

    const totalSales = d.days.reduce((sum, day) => sum + day.sales, 0);
    const totalProfit = d.days.reduce((sum, day) => sum + day.profit, 0);
    root.querySelector('[data-part="trend-caption"]').textContent =
      'Total ' + rupiah(totalSales) + ' penjualan dan ' + rupiah(totalProfit) + ' laba kotor pada ' + d.label.toLowerCase() + ' di ' + branch + '.';
  };

  const renderBranches = () => {
    branchBars.innerHTML = '';
    const d = data();
    const max = Math.max(...d.branches.map((entry) => entry.profit));
    d.branches.forEach((entry) => {
      const row = document.createElement('div');
      row.className = 'rep__bar-row';
      row.innerHTML =
        '<span class="rep__bar-top"><span></span><strong></strong></span>' +
        '<span class="rep__bar-track"><span class="rep__bar-fill"></span></span>';
      row.querySelector('.rep__bar-top span').textContent = entry.name + (entry.name === branch ? ' (aktif)' : '');
      row.querySelector('.rep__bar-top strong').textContent = rupiah(entry.profit);
      const fill = row.querySelector('.rep__bar-fill');
      fill.style.width = Math.max(4, Math.round(entry.profit / max * 100)) + '%';
      if (entry.name !== branch) fill.dataset.tone = 'accent';
      const margin = entry.sales ? (entry.profit / entry.sales * 100) : 0;
      row.querySelector('.rep__bar-track').setAttribute('title', entry.name + ' · margin ' + margin.toFixed(1) + '%');
      branchBars.append(row);
    });
  };

  const renderProducts = () => {
    const d = data();
    productBody.innerHTML = '';
    root.querySelector('[data-part="product-count"]').textContent = d.products.length + ' produk';
    root.querySelector('[data-part="product-empty"]').hidden = d.products.length > 0;
    d.products.forEach((item) => {
      const profit = item.sales - item.cogs;
      const margin = item.sales ? (profit / item.sales * 100) : 0;
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><span class="rep__item-name"></span><span class="rep__item-sku"></span></td>' +
        '<td class="num"></td>' +
        '<td class="num"></td>' +
        '<td class="num"></td>' +
        '<td class="num"></td>' +
        '<td class="num"></td>';
      tr.querySelector('.rep__item-name').textContent = item.name;
      tr.querySelector('.rep__item-sku').textContent = item.sku;
      tr.children[1].textContent = String(item.qty);
      tr.children[2].textContent = rupiah(item.sales);
      tr.children[3].textContent = rupiah(item.cogs);
      tr.children[4].textContent = rupiah(profit);
      tr.children[5].textContent = margin.toFixed(1).replace('.', ',') + '%';
      productBody.append(tr);
    });
  };

  const updateShift = () => {
    if (shiftClosed) return;
    const value = Number(shiftCash.value || 0);
    const hasValue = shiftCash.value !== '';
    const diff = value - expectedCash;
    const diffNode = root.querySelector('[data-part="shift-diff"]');
    const hint = root.querySelector('[data-part="shift-hint"]');
    diffNode.textContent = rupiah(diff);
    diffNode.style.color = diff === 0 ? 'var(--color-success, #136b3f)' : diff > 0 ? 'var(--color-accent, #12507f)' : 'var(--color-danger, #a52b22)';
    shiftCash.setAttribute('aria-invalid', String(hasValue && !Number.isFinite(Number(shiftCash.value))));
    if (!hasValue) {
      hint.dataset.tone = '';
      hint.textContent = 'Masukkan jumlah kas fisik untuk menghitung selisih.';
      return;
    }
    if (diff === 0) {
      hint.dataset.tone = 'ok';
      hint.textContent = 'Kas fisik sama dengan catatan sistem. Aman untuk ditutup.';
    } else if (Math.abs(diff) <= 10000) {
      hint.dataset.tone = 'warn';
      hint.textContent = 'Selisih dalam batas toleransi Rp10.000. Tetap beri catatan bila perlu.';
    } else {
      hint.dataset.tone = 'danger';
      hint.textContent = 'Selisih melebihi toleransi Rp10.000. Tandai perlu ditinjau agar tercatat di laporan.';
    }
  };

  const renderAll = () => {
    renderKpis();
    renderLineChart();
    renderBranches();
    renderProducts();
    updateShift();
  };

  const setPeriod = (next) => {
    period = next;
    root.querySelectorAll('[data-part="period"] button').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.period === next));
    });
    renderAll();
  };

  const setBranch = (next) => {
    branch = next;
    root.querySelectorAll('[data-part="branch"] button').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.branch === next));
    });
    renderAll();
  };

  const showShiftResult = (state) => {
    shiftState = state;
    const value = Number(shiftCash.value || 0);
    const diff = value - expectedCash;
    const title = root.querySelector('[data-part="shift-result-title"]');
    const note = root.querySelector('[data-part="shift-result-note"]');
    const status = root.querySelector('[data-part="shift-status"]');

    if (state === 'closed') {
      title.textContent = 'Shift ditutup';
      status.textContent = 'Selesai direkonsiliasi';
      status.className = 'rep__chip rep__chip--ok';
      note.textContent = 'Rekonsiliasi tercatat di laporan tutup kasir dan siap dicetak.';
    } else {
      title.textContent = 'Selisih perlu ditinjau';
      status.textContent = 'Perlu ditinjau';
      status.className = 'rep__chip rep__chip--warn';
      note.textContent = 'Selisih dikirim ke admin untuk pemeriksaan lanjutan pada laporan tutup kasir.';
    }

    const summary = root.querySelector('[data-part="shift-summary"]');
    summary.innerHTML = '';
    [
      ['Kas seharusnya', rupiah(expectedCash)],
      ['Kas fisik', rupiah(value)],
      ['Pembayaran QRIS', root.querySelector('[data-part="shift-qris"]').textContent],
      ['Kartu debit/kredit', root.querySelector('[data-part="shift-card"]').textContent]
    ].forEach(([label, amount]) => {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><strong></strong>';
      li.firstElementChild.textContent = label;
      li.lastElementChild.textContent = amount;
      summary.append(li);
    });
    const diffLi = document.createElement('li');
    diffLi.className = 'rep__grand';
    diffLi.innerHTML = '<span>Selisih</span><strong></strong>';
    diffLi.lastElementChild.textContent = rupiah(diff);
    summary.append(diffLi);

    shiftDialog.showModal();
    root.querySelector('[data-action="rep:shift-close"]').focus();
  };

  root.addEventListener('click', (event) => {
    const periodButton = event.target.closest('[data-part="period"] button');
    if (periodButton && root.contains(periodButton)) {
      setPeriod(periodButton.dataset.period);
      return;
    }
    const branchButton = event.target.closest('[data-part="branch"] button');
    if (branchButton && root.contains(branchButton)) {
      setBranch(branchButton.dataset.branch);
      return;
    }
    const control = event.target.closest('[data-action]');
    if (!control || !root.contains(control)) return;
    switch (control.dataset.action) {
      case 'rep:close-shift': {
        if (shiftCash.value === '') {
          shiftCash.setAttribute('aria-invalid', 'true');
          shiftCash.focus();
          const hint = root.querySelector('[data-part="shift-hint"]');
          hint.dataset.tone = 'danger';
          hint.textContent = 'Isi kas fisik hasil hitung sebelum menutup shift.';
          return;
        }
        shiftCash.setAttribute('aria-invalid', 'false');
        const diff = Number(shiftCash.value) - expectedCash;
        shiftClosed = true;
        showShiftResult(Math.abs(diff) <= 10000 ? 'closed' : 'review');
        break;
      }
      case 'rep:review-shift':
        if (shiftCash.value !== '') shiftCash.setAttribute('aria-invalid', 'false');
        showShiftResult('review');
        break;
      case 'rep:shift-close':
        shiftDialog.close();
        if (shiftState === 'closed') {
          shiftCash.disabled = true;
          root.querySelector('[data-action="rep:close-shift"]').disabled = true;
          root.querySelector('[data-action="rep:review-shift"]').disabled = true;
        }
        break;
    }
  }, { signal });

  root.addEventListener('input', (event) => {
    if (event.target === shiftCash) updateShift();
  }, { signal });

  renderAll();
})();
</script>

<template data-slot="header-actions">
  <div class="rep__segments" role="group" aria-label="Periode laporan" data-part="period">
    <button type="button" data-period="today" aria-pressed="false">Hari ini</button>
    <button type="button" data-period="week" aria-pressed="true">7 hari</button>
    <button type="button" data-period="month" aria-pressed="false">30 hari</button>
  </div>
  <div class="rep__segments" role="group" aria-label="Pilih cabang" data-part="branch">
    <button type="button" data-branch="Kebayoran" aria-pressed="true">Kebayoran</button>
    <button type="button" data-branch="Bintaro" aria-pressed="false">Bintaro</button>
  </div>
</template>
